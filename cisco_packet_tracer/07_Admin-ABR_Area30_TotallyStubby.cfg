! =====================================================================
! CISCO IOS CONFIGURATION: ADMIN-ABR (AREA 30 TOTALLY STUBBY AREA)
! Campus: VIT Vellore - Gandhi Block Central Administration & Finance
! Device: Cisco ISR 4331 / 2911 Router
! Role: Area Border Router (ABR) enforcing Totally Stubby Area (TSA)
! Security: Blocks Type-3 Summary & Type-5 External LSAs | Injects 0.0.0.0/0
! Subnet: 10.30.0.0/16 (Administrative & Examination Controller Core)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname Admin-ABR

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - GANDHI BLOCK ADMIN (ADMIN-ABR)
OSPF Area 30 Totally Stubby Area | Examination & Finance Core
RESTRICTED INTERNAL SECURITY ZONE - TYPE 3/4/5 LSAs BLOCKED
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for Admin-ABR
 ip address 10.30.0.1 255.255.255.255
 ip ospf 1 area 30
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - Administrative Core LAN Switch (Admin-SW1)
interface GigabitEthernet0/0/0
 description Gandhi Block Administration, Finance & Exam Server Subnet
 ip address 10.30.0.1 255.255.0.0
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 10G Armored Optical Conduit l5 to CTS-Core1 (Area 0)
interface GigabitEthernet0/0/1
 description 10G Secure Armored Optical Trunk l5 to CTS-Core1 (Area 0)
 ip address 10.0.0.22 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.30.0.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 ! Suppress OSPF hellos on confidential administrative LAN
 passive-interface GigabitEthernet0/0/0
 
 ! TOTALLY STUBBY AREA COMMAND:
 ! "no-summary" blocks Type-3 inter-area LSAs and injects a single default route (0.0.0.0/0)
 area 30 stub no-summary
 
 ! Area 0 Backbone Link
 network 10.0.0.20 0.0.0.3 area 0
 
 ! Area 30 Protected Admin Network
 network 10.30.0.0 0.0.255.255 area 30
exit

end
write memory
