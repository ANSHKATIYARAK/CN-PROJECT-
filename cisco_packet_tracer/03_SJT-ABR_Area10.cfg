! =====================================================================
! CISCO IOS CONFIGURATION: SJT-ABR (AREA 10 ACADEMIC CORE)
! Campus: VIT Vellore - Silver Jubilee Tower (Floors 1-12)
! Device: Cisco ISR 4331 / 2911 Router
! Role: Area Border Router (ABR) bridging Area 10 & Area 0
! Subnet: 10.10.0.0/18 (Aggregated into 10.10.0.0/16 to Backbone)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname SJT-ABR

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - SILVER JUBILEE TOWER (SJT-ABR)
OSPF Area 10 Academic Core | SCOPE & SENSE Faculty Labs
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for SJT-ABR
 ip address 10.10.0.1 255.255.255.255
 ip ospf 1 area 10
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - SJT Academic Access LAN Switch (Acad-SW1)
interface GigabitEthernet0/0/0
 description SJT Department LAN (Floors 1-12 Faculty & Labs)
 ip address 10.10.0.1 255.255.192.0
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 100G Primary Uplink to CTS-Core1 (Area 0)
interface GigabitEthernet0/0/1
 description 100G Optical Trunk l1 to CTS-Core1 (Area 0 Backbone)
 ip address 10.0.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/0/2 or Gig0/2 - 40G Inter-Tower Backup Conduit to TT-ABR (Area 10)
interface GigabitEthernet0/0/2
 description 40G Optical Conduit Link l8 to Tech Tower TT-ABR (Area 10)
 ip address 10.10.4.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.10.0.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 ! Suppress OSPF hello multicasts on access user facing LAN
 passive-interface GigabitEthernet0/0/0
 
 ! Route Summarization: Aggregates all Area 10 subnets into one /16 prefix to Area 0
 area 10 range 10.10.0.0 255.255.0.0
 
 ! Area 0 Backbone Link
 network 10.0.0.4 0.0.0.3 area 0
 
 ! Area 10 Internal Links & Academic LAN
 network 10.10.0.0 0.0.255.255 area 10
exit

end
write memory
