! =====================================================================
! CISCO IOS CONFIGURATION: CTS-CORE1 (AREA 0 BACKBONE SPINE)
! Campus: VIT Vellore Main Datacenter - Centre for Technical Support
! Device: Cisco ISR 4331 / 2911 Router
! Role: OSPF Area 0 Primary Backbone Spine Router
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname CTS-Core1

! Set domain and banner
banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - CTS CORE DATACENTER (SPINE-1)
OSPF Area 0 Backbone Spine | Authorized Access Only
=====================================================================
^C

! Enable IP Routing
ip routing

! Loopback0 Interface (Router-ID: 10.0.0.1)
interface Loopback0
 description Authoritative Router-ID for CTS Core Spine 1
 ip address 10.0.0.1 255.255.255.255
 ip ospf 1 area 0
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - 100G Optical Inter-Core Trunk to CTS-Core2
interface GigabitEthernet0/0/0
 description 100G Optical Inter-Core Trunk to CTS-Core2
 ip address 10.0.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 100G Optical Conduit Link l1 to SJT-ABR (Area 10)
interface GigabitEthernet0/0/1
 description 100G Optical Trunk l1 to SJT-ABR (Academic Core Area 10)
 ip address 10.0.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/0/2 or Gig0/2 - 100G Optical Conduit Link l2 to TT-ABR (Area 10)
interface GigabitEthernet0/0/2
 description 100G Optical Trunk l2 to TT-ABR (Academic Labs Area 10)
 ip address 10.0.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/1/0 (or Modular Slot/VLAN trunk to Area 0 Switch Core-SW1)
! Conduit Link l5 to Admin-ABR (Area 30 Totally Stubby)
interface GigabitEthernet0/1/0
 description 10G Optical Trunk l5 to Admin-ABR (Area 30 Admin)
 ip address 10.0.0.21 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/1/1 - Conduit Link l6 to PRP-ABR (Area 40 NSSA)
interface GigabitEthernet0/1/1
 description 100G Optical Trunk l6 to PRP-ABR (Area 40 Research Park)
 ip address 10.0.0.25 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.0.0.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 ! Backbone Area 0 Network Declarations
 network 10.0.0.0 0.0.0.255 area 0
exit

end
write memory
