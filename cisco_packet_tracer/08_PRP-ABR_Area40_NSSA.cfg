! =====================================================================
! CISCO IOS CONFIGURATION: PRP-ABR (AREA 40 NOT-SO-STUBBY AREA - NSSA)
! Campus: VIT Vellore - Pearl Research Park (PRP Supercomputing & Incubation)
! Device: Cisco ISR 4331 / 2911 Router
! Role: Area Border Router (ABR / ASBR) enforcing NSSA Operation
! Innovation: Imports external HPC/cloud routes as Type-7 LSAs & translates to Type-5
! Subnet: 10.40.0.0/16 (Research Clusters & AI Incubation)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname PRP-ABR

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - PEARL RESEARCH PARK (PRP-ABR)
OSPF Area 40 Not-So-Stubby Area (NSSA) | HPC Supercomputing Labs
TYPE-7 LSA TRANSLATION & EXTERNAL CLOUD REDISTRIBUTION GATEWAY
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for PRP-ABR
 ip address 10.40.0.1 255.255.255.255
 ip ospf 1 area 40
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - Research Supercomputing LAN Switch (Rsrch-SW1)
interface GigabitEthernet0/0/0
 description Pearl Research Park Supercomputing & AI Lab Subnet
 ip address 10.40.0.1 255.255.0.0
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 100G Optical Conduit l6 to CTS-Core1 (Area 0)
interface GigabitEthernet0/0/1
 description 100G Research Optical Trunk l6 to CTS-Core1 (Area 0 Backbone)
 ip address 10.0.0.26 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.40.0.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 passive-interface GigabitEthernet0/0/0
 
 ! NSSA COMMAND:
 ! Allows local external redistribution as Type-7 LSAs, converted to Type-5 at ABR
 area 40 nssa
 
 ! Route Summarization: Aggregates Area 40 subnets into one /16 prefix to Area 0
 area 40 range 10.40.0.0 255.255.0.0
 
 ! Area 0 Backbone Link
 network 10.0.0.24 0.0.0.3 area 0
 
 ! Area 40 Research Cluster Network
 network 10.40.0.0 0.0.255.255 area 40
exit

end
write memory
