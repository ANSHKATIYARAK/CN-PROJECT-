! =====================================================================
! CISCO IOS CONFIGURATIONS: CAMPUS ACCESS & AGGREGATION SWITCHES
! Platform: Cisco Catalyst 2960 / 3560 / 3650 (Cisco Packet Tracer)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

! =====================================================================
! 1. CORE-SW1 (AREA 0 BACKBONE MULTI-LAYER / INTERCONNECT SWITCH)
! =====================================================================
enable
configure terminal
hostname Core-SW1

vlan 10
 name Area0-Backbone
vlan 20
 name Management-VLAN
exit

interface range GigabitEthernet0/1 - 8
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

interface Vlan10
 description Core Interconnect SVI
 ip address 10.0.0.254 255.255.255.0
 no shutdown
exit
end
write memory


! =====================================================================
! 2. ACAD-SW1 (AREA 10 ACADEMIC ACCESS SWITCH - SJT BUILDING)
! =====================================================================
enable
configure terminal
hostname Acad-SW1

vlan 100
 name SJT-Floors-1to12-Academic
exit

interface range FastEthernet0/1 - 20
 description Student & Faculty Workstations / Access Points
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 no shutdown
exit

interface GigabitEthernet0/1
 description Uplink to SJT-ABR Gig0/0
 switchport mode access
 switchport access vlan 100
 no shutdown
exit
end
write memory


