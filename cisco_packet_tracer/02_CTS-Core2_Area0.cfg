! =====================================================================
! CISCO IOS CONFIGURATION: CTS-CORE2 (AREA 0 BACKBONE SPINE 2)
! Campus: VIT Vellore Main Datacenter - Centre for Technical Support
! Device: Cisco ISR 4331 / 2911 Router
! Role: OSPF Area 0 Secondary Backbone Spine Router
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname CTS-Core2

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - CTS CORE DATACENTER (SPINE-2)
OSPF Area 0 Backbone Spine Redundancy | Residential Aggregation
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for CTS Core Spine 2
 ip address 10.0.0.2 255.255.255.255
 ip ospf 1 area 0
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 - 100G Optical Inter-Core Trunk to CTS-Core1
interface GigabitEthernet0/0/0
 description 100G Optical Inter-Core Trunk to CTS-Core1
 ip address 10.0.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/0/1 - 40G Optical Trunk l3 to MH-ABR (Area 20 Hostels)
interface GigabitEthernet0/0/1
 description 40G Optical Trunk l3 to MH-ABR (Men Hostels Area 20)
 ip address 10.0.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 2
 no shutdown
exit

! GigabitEthernet0/0/2 - 40G Optical Trunk l4 to WH-ABR (Area 20 Hostels)
interface GigabitEthernet0/0/2
 description 40G Optical Trunk l4 to WH-ABR (Women Hostels Area 20)
 ip address 10.0.0.17 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 2
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.0.0.2
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 network 10.0.0.0 0.0.0.255 area 0
exit

end
write memory
