! =====================================================================
! CISCO IOS CONFIGURATION: MH-ABR (AREA 20 RESIDENTIAL - MEN HOSTELS)
! Campus: VIT Vellore - Men's Hostels Complex (Blocks A to T)
! Device: Cisco ISR 4331 / 2911 Router
! Role: Area Border Router (ABR) bridging Area 20 & Area 0
! Subnet: 10.20.0.0/17 (Aggregated into 10.20.0.0/16 to Backbone)
! Capacity: 22,000 Resident Students (Isolates Flapping Wi-Fi Ports)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname MH-ABR

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - MEN'S HOSTELS COMPLEX (MH-ABR)
OSPF Area 20 Residential Zone | Blocks A through T (22,000 Beds)
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for MH-ABR
 ip address 10.20.0.1 255.255.255.255
 ip ospf 1 area 20
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - Men's Hostels Distribution LAN Switch (Hst-SW1)
interface GigabitEthernet0/0/0
 description Men's Hostels High-Density Wi-Fi & Student Access LAN
 ip address 10.20.0.1 255.255.128.0
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 40G Optical Trunk l3 to CTS-Core2 (Area 0)
interface GigabitEthernet0/0/1
 description 40G Optical Trunk l3 to CTS-Core2 (Area 0 Backbone)
 ip address 10.0.0.14 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 2
 no shutdown
exit

! GigabitEthernet0/0/2 or Gig0/2 - 10G Inter-Hostel Ring Link l9 to WH-ABR (Area 20)
interface GigabitEthernet0/0/2
 description 10G Optical Ring Conduit Link l9 to WH-ABR (Area 20)
 ip address 10.20.4.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.20.0.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 ! Suppress OSPF hellos on residential student Wi-Fi VLANs
 passive-interface GigabitEthernet0/0/0
 
 ! Route Summarization: Aggregates Men's & Women's Hostels into 10.20.0.0/16
 area 20 range 10.20.0.0 255.255.0.0
 
 ! Area 0 Backbone Link
 network 10.0.0.12 0.0.0.3 area 0
 
 ! Area 20 Internal Hostels Network
 network 10.20.0.0 0.0.255.255 area 20
exit

end
write memory
