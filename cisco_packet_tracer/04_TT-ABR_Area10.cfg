! =====================================================================
! CISCO IOS CONFIGURATION: TT-ABR (AREA 10 COMPUTING LABS CORE)
! Campus: VIT Vellore - Technology Tower (TT Computing Labs)
! Device: Cisco ISR 4331 / 2911 Router
! Role: Area Border Router (ABR) bridging Area 10 & Area 0
! Subnet: 10.10.64.0/18 (Aggregated into 10.10.0.0/16 to Backbone)
! Authors: Ansh Katiyar (25BIT0333), Arham Choudhary (25BIT0208), Sri Harsha (25BIT0292)
! =====================================================================

enable
configure terminal

hostname TT-ABR

banner motd ^C
=====================================================================
VIT VELLORE ENTERPRISE NETWORK - TECHNOLOGY TOWER (TT-ABR)
OSPF Area 10 Computing Labs | Cloud & Software Engineering Suites
=====================================================================
^C

ip routing

interface Loopback0
 description Authoritative Router-ID for TT-ABR
 ip address 10.10.64.1 255.255.255.255
 ip ospf 1 area 10
 no shutdown
exit

! ---------------------------------------------------------------------
! INTERFACE CONFIGURATIONS
! ---------------------------------------------------------------------

! GigabitEthernet0/0/0 or Gig0/0 - TT Computing Labs LAN Switch (Acad-SW2)
interface GigabitEthernet0/0/0
 description Technology Tower High-Density Computing Labs LAN
 ip address 10.10.64.1 255.255.192.0
 no shutdown
exit

! GigabitEthernet0/0/1 or Gig0/1 - 100G Primary Uplink to CTS-Core1 (Area 0)
interface GigabitEthernet0/0/1
 description 100G Optical Trunk l2 to CTS-Core1 (Area 0 Backbone)
 ip address 10.0.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 1
 no shutdown
exit

! GigabitEthernet0/0/2 or Gig0/2 - 40G Inter-Tower Backup Conduit to SJT-ABR (Area 10)
interface GigabitEthernet0/0/2
 description 40G Optical Conduit Link l8 to Silver Jubilee Tower SJT-ABR (Area 10)
 ip address 10.10.4.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 1
 no shutdown
exit

! ---------------------------------------------------------------------
! OSPF ROUTING PROCESS CONFIGURATION (RFC 2328)
! ---------------------------------------------------------------------
router ospf 1
 router-id 10.10.64.1
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 
 passive-interface GigabitEthernet0/0/0
 
 ! Route Summarization: Aggregates Area 10 subnets to Area 0
 area 10 range 10.10.0.0 255.255.0.0
 
 ! Area 0 Backbone Link
 network 10.0.0.8 0.0.0.3 area 0
 
 ! Area 10 Internal Links & Computing LAN
 network 10.10.0.0 0.0.255.255 area 10
exit

end
write memory
